name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - name: Tree-shaking (side-effect-free imports, one export pulls in only its own code)
        run: npm run check:treeshake
      - name: Prerequisite docs in all five places (check:peer-docs)
        run: npm run check:peer-docs
      - name: Package lint (publint + are-the-types-wrong)
        if: matrix.node == 22
        run: npm run lint:package
      - name: Package contents (dry run)
        if: matrix.node == 22
        run: npm pack --dry-run
      - name: Bundle size budget
        if: matrix.node == 22
        run: npm run size:check | tee -a "$GITHUB_STEP_SUMMARY"
