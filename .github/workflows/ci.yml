name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - name: Tree-shaking (side-effect-free imports, one export pulls in only its own code)
        run: npm run check:treeshake
      - name: Runtime tiers (basic / standard / advanced bundles within fixed budgets)
        run: npm run check:tiers
      - name: Component contract (12.0, blocking — docs/component-contract.md)
        run: npm run check:contract
      - name: Prerequisite docs in all five places (check:peer-docs)
        run: npm run check:peer-docs
      - name: Package lint (publint + are-the-types-wrong)
        if: matrix.node == 22
        run: npm run lint:package
      - name: Package contents (dry run)
        if: matrix.node == 22
        run: npm pack --dry-run
      - name: Package size — no source maps on npm, fixed limits (check:pack)
        if: matrix.node == 22
        run: npm run check:pack | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bundle size budget
        if: matrix.node == 22
        run: npm run size:check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Component playground in headless Chrome — Run / Copy / Download share the editor, standalone download, import map, prerequisite hints, sandbox isolation, 390 px (check:playground)
        if: matrix.node == 22
        run: npm run check:playground | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Performance metrics in headless Chrome — first-screen transfer, script time, GPU resources, frame stability (perf/budgets.json)
        if: matrix.node == 22
        run: npm run perf | tee -a "$GITHUB_STEP_SUMMARY"

  browser:
    name: Browser (${{ matrix.browser }})
    # 13.1.0: real-browser regression suite (test/browser, Playwright) on the built package — docs/browser-matrix.md
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install ${{ matrix.browser }} (with system dependencies)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install system dependencies (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Browser suite — lifecycle, keyboard / ARIA, motion sensitivity, resource release, complex-page performance
        run: npm run test:browser -- --project=${{ matrix.browser }}
        env:
          PERF_RECORD: '1'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
