name: Showcase (GitHub Pages)

# Builds dist/ and publishes the no-build showcase (showcase/), the preset
# playground (demo/) and the dist/ files they import to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r showcase demo dist _site/
          # 12.1: the cross-platform previewer (showcase/xplat.html) needs the exporter and the motion tokens
          mkdir -p _site/bin _site/docs && cp bin/xplat.mjs _site/bin/ && cp docs/motion.tokens.json _site/docs/
          rm -f _site/dist/*.map _site/dist/chunks/*.map
          touch _site/.nojekyll
          # 10.1: AI-readable manifest + llms.txt at the site root
          cp dist/manifest.json _site/components.json
          cp dist/manifest.schema.json _site/components.schema.json
          cp dist/llms.txt dist/llms-full.txt _site/
          # 13.0.2: the component playground's npm + bundler tab builds its import map from package.json "exports"
          cp package.json _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Motionary</title>
          <meta http-equiv="refresh" content="0; url=./showcase/">
          <script>location.replace('./showcase/' + location.hash)</script>
          <a href="./showcase/">Motionary showcase</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}showcase/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
