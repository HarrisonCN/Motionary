name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # 16.3: the source maps (not on npm) as a release asset too — same files as dist/**/*.map in the tag tree
          find dist -name '*.map' | tar -czf "motionary-${TAG#v}-sourcemaps.tgz" -T -
          gh release upload "$TAG" ./*.tgz --clobber
