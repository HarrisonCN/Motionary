name: Publish to npm (provenance)

# npm trusted publishing: npm authenticates this workflow through GitHub OIDC, so no npm token is stored anywhere.
# Each package (motionary and use-scroll-animate) needs a trusted publisher on npmjs.com with repository
# HarrisonCN/Motionary, workflow publish.yml and environment npm. Provenance is attached automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'git tag to publish, e.g. v16.9.0'
        required: true
      dist_tag:
        description: 'npm dist-tag (latest, next, v16-line …)'
        required: true
        default: latest

permissions:
  contents: read
  id-token: write # OIDC: npm provenance + trusted publishing

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag matches the manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw Error('tag/version mismatch')"
      - run: npm install -g npm@11.9.0 # trusted publishing needs npm >= 11.5.1 and Node >= 22.14
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size:check
      - run: npm run check:exports
      - name: Publish missing packages from the verified build
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          trap 'git restore -- package.json' EXIT
          for name in motionary use-scroll-animate; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$name/$version")
            case "$status" in
              200) echo "$name@$version already published"; continue ;;
              404) ;;
              *) echo "Registry returned $status for $name@$version" >&2; exit 1 ;;
            esac
            node -e "const fs=require('node:fs'), p=require('./package.json'); p.name=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')" "$name"
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent
            npm publish "$RUNNER_TEMP/$name-$version.tgz" --provenance --access public --tag "$DIST_TAG"
          done
      - name: Explain an npm authentication failure
        if: failure()
        run: |
          echo "::error::If npm said ENEEDAUTH or E404 on PUT, the trusted publisher on npmjs.com does not match this run."
          echo "::error::Check both packages: user HarrisonCN, repository Motionary, workflow publish.yml, environment npm, publish allowed."
