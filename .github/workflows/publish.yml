name: Publish to npm (provenance)

# Authenticate package uploads with the repository's NPM_TOKEN secret. OIDC signs build provenance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'git tag to publish, e.g. v16.9.0'
        required: true
      dist_tag:
        description: 'npm dist-tag (latest, next, v16-line …)'
        required: true
        default: latest

permissions:
  contents: read
  id-token: write # OIDC: npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the npm publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Configure the NPM_TOKEN Actions secret with publish access to both packages."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag matches the manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw Error('tag/version mismatch')"
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size:check
      - run: npm run check:exports
      - name: Publish missing packages from the verified build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          trap 'git restore -- package.json' EXIT
          for name in motionary use-scroll-animate; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$name/$version")
            case "$status" in
              200) echo "$name@$version already published"; continue ;;
              404) ;;
              *) echo "Registry returned $status for $name@$version" >&2; exit 1 ;;
            esac
            node -e "const fs=require('node:fs'), p=require('./package.json'); p.name=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')" "$name"
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent
            npm publish "$RUNNER_TEMP/$name-$version.tgz" --provenance --access public --tag "$DIST_TAG"
          done
