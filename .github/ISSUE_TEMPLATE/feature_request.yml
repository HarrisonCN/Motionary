name: Feature request
description: Suggest a preset, option, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behaviour
      render: js
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds you tried
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This keeps the library dependency-free and small (see size-budget.json).
