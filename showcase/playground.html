<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Motionary · Playground</title>
  <meta name="description" content="Compose motionary effects visually, tweak every parameter live and export HTML, ES module, React or Vue code." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Motionary" />
  <meta property="og:title" content="Motionary · Playground" />
  <meta property="og:description" content="Compose motionary effects visually, tweak every parameter live and export HTML, ES module, React or Vue code." />
  <meta property="og:url" content="https://harrisoncn.github.io/Motionary/showcase/playground.html" />
  <meta property="og:image" content="https://harrisoncn.github.io/Motionary/showcase/assets/og-motionary.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Cpath d='M18 40 32 22l14 18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var d = document.documentElement;
        d.setAttribute('data-theme', localStorage.getItem('usa-showcase:theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        var lang = localStorage.getItem('usa-showcase:lang') || ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
        d.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./gallery.css" />
  <link rel="stylesheet" href="./playground.css" />
</head>
<body class="gallery-page pg-page">
  <header class="topbar">
    <a class="brand" href="./components.html">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15 12 7l7 8" /></svg></span>
      <span class="brand-name">Motionary</span>
      <span class="brand-store" data-pg="title">Playground</span>
    </a>
    <nav class="topbar-actions" aria-label="Site">
      <a class="icon-btn nav-link" href="./components.html" data-pg="back">Components</a>
      <button class="icon-btn" id="pg-lang" type="button" aria-label="Switch language">中文</button>
    </nav>
  </header>
  <main class="pg" id="main">
    <p class="pg-lead" data-pg="lead">Stack effects, tweak them live, and copy the code.</p>
    <p class="pg-note" id="pg-reduced" hidden data-pg="reduced"></p>
    <div class="pg-grid">
      <section class="pg-panel" aria-labelledby="pg-layers-h">
        <label class="pg-field"><span data-pg="content">Content</span> <select id="pg-content"></select></label>
        <div class="pg-add"><select id="pg-effect" aria-label="Effect"></select> <button type="button" class="demo-link" id="pg-add" data-pg="add">Add effect</button></div>
        <h2 id="pg-layers-h" data-pg="layers">Layers (outermost first)</h2>
        <ol class="pg-layers" id="pg-layers"></ol>
      </section>
      <section class="pg-panel" aria-labelledby="pg-prev-h">
        <div class="pg-row"><h2 id="pg-prev-h" data-pg="preview">Preview</h2><button type="button" class="demo-link" id="pg-replay" data-pg="replay">Replay</button></div>
        <div class="pg-stage" id="pg-stage" aria-live="off"></div>
      </section>
      <section class="pg-panel pg-tl" aria-labelledby="pg-tl-h">
        <div class="pg-row"><h2 id="pg-tl-h" data-pg="tracks">Timeline tracks</h2><span><button type="button" class="demo-link" id="pg-add-track" data-pg="addTrack">Add track</button> <button type="button" class="demo-link" id="pg-play-tl" data-pg="playTl">Play timeline</button></span></div>
        <div class="pg-ruler" id="pg-ruler" aria-hidden="true"></div>
        <ol class="pg-tracks" id="pg-tracks"></ol>
        <div class="pg-tl-stage" id="pg-tl-stage"></div>
        <div class="pg-row pg-presets"><h3 data-pg="presets">Presets</h3>
          <input id="pg-preset-name" type="text" maxlength="40" aria-label="Preset name" />
          <button type="button" class="demo-link" id="pg-preset-save" data-pg="savePreset">Save</button>
          <select id="pg-preset-list" aria-label="Saved presets"></select>
          <button type="button" class="demo-link" id="pg-preset-del" data-pg="deletePreset">Delete</button>
          <button type="button" class="demo-link" id="pg-preset-json" data-pg="exportJson">Copy preset JSON</button>
          <label class="demo-link pg-file"><span data-pg="importJson">Import JSON…</span><input type="file" id="pg-preset-file" accept="application/json,.json" hidden /></label>
        </div>
      </section>
      <section class="pg-panel pg-code" aria-labelledby="pg-code-h">
        <div class="pg-row"><h2 id="pg-code-h" data-pg="code">Export code</h2><button type="button" class="demo-link" id="pg-share" data-pg="share">Copy share link</button></div>
        <div class="pg-tabs" role="tablist" id="pg-tabs"></div>
        <pre class="pg-pre"><code id="pg-out"></code></pre>
        <button type="button" class="demo-link" id="pg-copy" data-pg="copy">Copy</button>
      </section>
    </div>
  </main>
  <script type="module" src="./playground.js"></script>
</body>
</html>
