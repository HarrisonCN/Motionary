name: usa_native_sample
description: motionary components in a Flutter WebView, synced with the system's reduce-motion and theme (4.7+).
publish_to: none
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
flutter:
  assets:
    - assets/web/   # copy examples/native/web/* (and components.umd.js) here
