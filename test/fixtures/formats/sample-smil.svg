<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 120">
  <!-- Motionary test fixture (MIT, written for this repo): one of every supported SMIL element -->
  <path id="track" d="M10 100 C 60 10, 140 10, 190 100" fill="none" stroke="#ccc"/>
  <circle id="dot" cx="20" cy="60" r="8" fill="#6366f1">
    <animate attributeName="cx" values="20;180;20" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" from="#6366f1" to="#ec4899" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="r" values="8;14;8" dur="1s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <rect id="box" x="90" y="50" width="20" height="20" fill="#22c55e">
    <animateTransform attributeName="transform" type="rotate" from="0 100 60" to="360 100 60" dur="3s" repeatCount="2"/>
    <set attributeName="opacity" to="0.5" begin="1s"/>
  </rect>
  <polygon id="ship" points="-6,-4 6,0 -6,4" fill="#f59e0b">
    <animateMotion dur="4s" rotate="auto" repeatCount="indefinite"><mpath xlink:href="#track"/></animateMotion>
  </polygon>
  <path id="blob" d="M60 20 L80 20 L70 40 Z" fill="#0ea5e9">
    <animate attributeName="d" values="M60 20 L80 20 L70 40 Z;M70 15 A12 12 0 1 1 69.9 15 Z" dur="1.5s" fill="freeze"/>
  </path>
  <text id="label" x="10" y="15" font-size="10">steps<animate attributeName="x" values="10;40;70" dur="3s" calcMode="discrete"/></text>
</svg>
